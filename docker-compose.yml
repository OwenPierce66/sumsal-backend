services:
  db:
    image: postgres:17
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: .env

  django:
    build:
      context: .
      args:
        - DEV=true
    container_name: django-docker
    depends_on:
      db:                          
        condition: service_healthy
    volumes:
      - .:/app      # Hot-reload: Maps your code into the container. AI did it
      - ./static:/app/staticfiles
    environment:
      - PYTHONUNBUFFERED=1  # 1. These 5 lines where added by ai for the rich dev dependency to work with docker: Forces output to stream to console in real-time
      - FORCE_COLOR=1       # 2. Tells Rich (and other tools) to use ANSI colors
      - TERM=xterm-256color # 3. Mimics a high-color terminal inside the container
      - DATABASE_URL=postgres://dbuser:dbpassword@db:5432/dockerdjango
    env_file: .env

  frontend-proxy:
    image: nginx:latest
    container_name: sumsal-backend-frontend-proxy-1
    ports:
      - "8001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/static:ro
    depends_on:
      - django
volumes:
  postgres_data: {}