services:
  db:
    image: postgres:17
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: .env

  redis:
    image: redis:7-alpine
    container_name: redis-docker
    mem_limit: 64m  
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

  django:
    build:
      context: .
      args:
        - DEV=true
    image: aportaciones-backend-django:latest
    container_name: django-docker
    command: python manage.py runserver 0.0.0.0:8000 --noreload
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app      # Hot-reload: Maps your code into the container. AI did it
      - ./static:/app/staticfiles
    environment:
      - PYTHONUNBUFFERED=1
      - FORCE_COLOR=1
      - TERM=xterm-256color
      - DATABASE_URL=postgres://dbuser:dbpassword@db:5432/dockerdjango
      - PYTHONDONTWRITEBYTECODE=1
      - REDIS_URL=redis://redis:6379/1
    env_file: .env
  celery-worker:
    image: aportaciones-backend-django:latest
    container_name: celery-worker
    command: celery -A Sumsal_Backend worker -l INFO --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgres://dbuser:dbpassword@db:5432/dockerdjango
      - PYTHONDONTWRITEBYTECODE=1
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/2
    env_file: .env

  frontend-proxy:
    image: nginx:latest
    container_name: sumsal-backend-frontend-proxy-1
    ports:
      - "8001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/static:ro
      - ./media:/media:ro
    depends_on:
      - django

volumes:
  postgres_data: {}
  redis_data: {}