services:
  db:
    image: postgres:17
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: .env

  django-web:
    build: .
    container_name: django-docker
    depends_on:
      - db
    volumes:
      - .:/app      # Hot-reload: Maps your code into the container. AI did it
      - ./static:/app/staticfiles
    environment:
      - PYTHONUNBUFFERED=1  # 1. These 5 lines where added by ai for the rich dev dependency to work with docker: Forces output to stream to console in real-time
      - FORCE_COLOR=1       # 2. Tells Rich (and other tools) to use ANSI colors
      - TERM=xterm-256color # 3. Mimics a high-color terminal inside the container
    tty: true               # 4. Allocates a pseudo-TTY
    stdin_open: true        # 5. Keeps the input stream open
    env_file: .env

  frontend-proxy:
    image: nginx:latest
    ports:
      - "8001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/static:ro
    depends_on:
      - django-web
volumes:
  postgres_data: